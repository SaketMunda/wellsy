[project]
name = "wellsy"
version = "0.1.0"
description = "WELLSY — a local, private, agentic assistant. Perception core (T0–T1)."
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2",
    "opencv-python>=4.10",
    "supervision>=0.30.0",
    "ultralytics>=8.4.120",
    "clip",
    # capture layer (step 3) — mss is the portable fallback; the pyobjc
    # frameworks back the macOS ScreenCaptureKit path and are darwin-only.
    "mss>=10.0",
    "pyobjc-framework-Quartz>=10.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-ScreenCaptureKit>=10.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=10.0 ; sys_platform == 'darwin'",
    # step 2 — portable inference seam
    "onnxruntime>=1.29",  # portable runtime for the small models (ASR/TTS/VAD)
    "httpx>=0.28",        # streaming OpenAI-compatible HTTP client (LLM/VLM backend)
    "psutil>=7.0",        # resident-memory readout for `wellsy bench`
    # step 4 — streaming voice path. Pipecat is the streaming frame pipeline,
    # turn detection (Smart Turn v3, ONNX, bundled) and barge-in; extras:
    #   local   -> pyaudio (LocalAudioTransport, portable PortAudio)
    #   whisper -> faster-whisper (CTranslate2, portable CPU/CUDA) — the ASR path
    #   kokoro  -> kokoro-onnx — the portable fast TTS baseline
    # Silero VAD and Smart Turn v3 models ship inside the pipecat wheel, so no
    # network fetch and no platform package (INVARIANTS #14).
    "pipecat-ai[local,whisper,kokoro]==1.8.1",
]

[project.optional-dependencies]
# macOS-only, opt-in, NEVER in the default install and NEVER imported at module
# scope (INVARIANTS #14). Reached only via WELLSY_LLM_BACKEND=mlx / explicit config.
inference-mlx = ["mlx-lm>=0.28"]

[project.scripts]
wellsy = "engine.cli:main"

[tool.uv]
# pipecat-ai 1.8.1 core-pins onnxruntime~=1.24.3; step 2 verified and pinned
# onnxruntime>=1.29 (spec/model-inventory.md, INVARIANTS #8). ORT is
# session-API-stable across 1.24->1.29 and both pipecat's bundled models
# (silero_vad.onnx, smart-turn-v3.2-cpu.onnx) and engine/inference load on 1.29
# — verified in step 4. Override keeps one ORT for the whole tree.
override-dependencies = ["onnxruntime>=1.29"]

[tool.uv.sources]
# YOLOE's open-vocabulary text-prompt head needs Ultralytics' CLIP fork
# (detector.py -> model.get_text_pe). Not the PyPI `clip` package.
clip = { git = "https://github.com/ultralytics/CLIP.git" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "soundfile>=0.12",  # test/bench audio I/O for the ASR/TTS conformance fixtures
]

# The installable/distribution name is `wellsy` and the console command is
# `wellsy`; the import package is `engine` (the runtime core), so the repo
# folder isn't `wellsy/wellsy/`. Like `pip install wellsy` → `import engine`.
[tool.setuptools.packages.find]
include = ["engine*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
