[project]
name = "wellsy"
version = "0.2.0"
description = "WELLSY — a voice-first JARVIS on your own computer, with no lock-in to any model provider."
requires-python = ">=3.13"
# Only what the kept orb + HUD (engine/interface) needs. Phase 0 of
# .claude/PLAN.md verifies and pins the rest (deepagents, Composio,
# Playwright MCP, provider SDKs) before they are added here.
dependencies = [
    "pipecat-ai==1.8.1",  # voice pipeline; engine/interface/taps.py reads its frames
    "numpy>=2.2",         # orb point cloud
    "psutil>=7.0",        # resident-memory readout in `wellsy` (interface cli)
]

[project.optional-dependencies]
# The native orb + HUD. PySide6 is portable (macOS/Linux/Windows); pyobjc is
# the macOS NSPanel shim, darwin-only.
interface = [
    "pyside6>=6.11.2,<6.12",
    "pyobjc-framework-Cocoa>=10.0 ; sys_platform == 'darwin'",
]

[project.scripts]
wellsy = "engine.interface.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

# Distribution name `wellsy`, import package `engine`.
[tool.setuptools.packages.find]
include = ["engine*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
