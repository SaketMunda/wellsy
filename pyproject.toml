[project]
name = "wellsy"
version = "0.2.0"
description = "WELLSY — a voice-first JARVIS on your own computer, with no lock-in to any model provider."
requires-python = ">=3.13"
# Components are pinned to a release at least two weeks old (Phase 0,
# 2026-10-24). Versions, release dates and key dependencies: .claude/STATUS.md.
# `wellsy doctor` checks the installed versions against these pins.
dependencies = [
    "pipecat-ai[google,local]==1.12.0",  # voice pipeline + Gemini Live + mic/speaker (pyaudio); taps.py reads its frames
    "deepagents==0.7.23",          # the brain
    "langchain-openrouter==0.2.9", # OpenRouter chat models for deepagents
    "langchain-tavily==0.2.18",    # web search tool for the brain (settings: [search])
    "composio==0.25.0",            # apps (Gmail, Calendar, …)
    "composio-langchain==0.25.0",  # Composio tools as LangChain tools
    "composio-client==2.0.0rc8",   # composio 0.25.0 requires this exact pre-release
    "langchain-mcp-adapters==0.3.2", # Playwright MCP tools for deepagents
    "python-dotenv>=1.0",          # loads .env keys
    "truststore==0.10.4",          # TLS via the OS certificate store (python.org macOS builds have none)
    "packaging>=23.2",             # `wellsy doctor` reads the pins below
    "numpy>=2.2",                  # orb point cloud
    "psutil>=7.0",                 # resident-memory readout in `wellsy` (interface cli)
]

[project.optional-dependencies]
# The Local preset: Whisper (MLX) + Ollama + Kokoro through Pipecat's own
# services, and an Ollama brain for deepagents.
local = [
    "pipecat-ai[kokoro,mlx-whisper,whisper]==1.12.0",  # whisper: Pipecat's MLX service imports faster-whisper
    "langchain-ollama==1.1.0",
]
# The native orb + HUD. PySide6 is portable (macOS/Linux/Windows); pyobjc is
# the macOS NSPanel shim, darwin-only.
interface = [
    "pyside6>=6.11.2,<6.12",
    "pyobjc-framework-Cocoa>=10.0 ; sys_platform == 'darwin'",
]

[project.scripts]
wellsy = "engine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pipecat-ai[evals]==1.12.0",  # `pipecat eval run evals/*.yaml`: scripted spoken turns against `wellsy talk --eval`
]

[tool.uv]
# Pre-releases only where a direct requirement names one (composio-client).
prerelease = "if-necessary-or-explicit"
# Resolve the whole tree, transitive deps included, from releases at least two
# weeks old at pin time. Move this date when re-pinning.
exclude-newer = "2026-10-10T00:00:00Z"

# Distribution name `wellsy`, import package `engine`.
[tool.setuptools.packages.find]
include = ["engine*"]

[tool.setuptools.package-data]
engine = ["settings.toml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
