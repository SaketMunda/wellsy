# WELLSY settings. Swapping a model or provider is an edit here, never a code change.
# Model IDs and prices were verified on 2026-10-24; see .claude/STATUS.md for sources.

# The model picker. A preset sets every role at once; `brain` swaps only the brain.
preset = "value"  # value | premium | local
brain = ""        # one-line brain swap: a name from [models], e.g. "glm" or "claude-opus". Empty = the preset's brain.

# Every model WELLSY can use. Each names a provider and that provider's model ID.
[models]
deepseek-flash = { provider = "openrouter", model = "deepseek/deepseek-v4.1-flash-1017" }
glm            = { provider = "openrouter", model = "z-ai/glm-5.3" }
kimi           = { provider = "openrouter", model = "moonshotai/kimi-k3" }
claude-opus    = { provider = "openrouter", model = "anthropic/claude-opus-5.5" }
gpt            = { provider = "openrouter", model = "openai/gpt-6-astra" }
ollama-brain   = { provider = "ollama",     model = "qwen3.5:4b-q4_K_M" }
# Voice models. Pipecat 1.12 defaults Gemini Live to an old 2.5 preview, so the model is always passed.
# Voice: Sulafat. Gemini's affective dialog (expressive mode) is rejected by gemini-3.8-live
# (1007 invalid argument, v1beta and v1alpha, 2026-10-24); expression comes from VOICE_PROMPT.
gemini-live    = { provider = "gemini", model = "gemini-3.8-live", voice = "Sulafat" }
# UNTESTED: the session opens, but the OpenAI account has no credits (insufficient_quota, 2026-10-24).
gpt-realtime   = { provider = "openai", model = "gpt-realtime-2.1" }
# Speech-to-text -> model -> voice, all on this machine through Pipecat's own services.
local-voice    = { provider = "local", model = "qwen3.5:4b-q4_K_M", stt = "mlx-community/whisper-large-v3-turbo", tts = "af_heart" }

[presets.value]
voice         = "gemini-live"
brain         = "deepseek-flash"
long_run      = "glm"
hard_planning = "kimi"

[presets.premium]
voice     = "gpt-realtime"
brain     = "claude-opus"
alt_brain = "gpt"

[presets.local]
voice = "local-voice"
brain = "ollama-brain"

# The brain's web search: any LangChain search tool, as "module:Class" plus its arguments.
# Tavily: $0.008 a basic search, the first 1,000 a month free (tavily.com/pricing, 2026-10-24).
# Swap to Exa (about $0.007 a search; Exa's list price as quoted in OpenRouter's docs):
# tool = "langchain_exa:ExaSearchResults",
# key EXA_API_KEY, after `uv add langchain-exa==1.1.0`.
[search]
tool = "langchain_tavily:TavilySearch"
key  = "TAVILY_API_KEY"
args = { max_results = 5, search_depth = "basic" }
price_per_call = 0.008  # USD list price, for the cost log; search is billed outside OpenRouter

[voice]
# Silero VAD gives Pipecat the user's turn frames: the latency timestamps, narration
# holding back while the user talks, and Pipecat's own barge-in. Gemini Live also runs
# its own server-side turn-taking (below).
vad_stop_secs = 0.2
# Gemini Live's own end-of-speech detection, which decides when it answers. Lower
# silence = faster replies but more risk of cutting the user off mid-sentence.
gemini_vad = { end_sensitivity = "END_SENSITIVITY_HIGH", silence_duration_ms = 300 }
# Optional `gemini_thinking = {...}` is passed through as Gemini's ThinkingConfig. Left
# unset: gemini-3.8-live rejects thinking_level, and thinking_budget = 0 measured slower (2026-10-24).
# Progress narration (spec §14: no robotic narration). A task says nothing for its
# first `narrate_after_secs`, then at most one update every `narrate_every_secs`.
narrate_after_secs = 6
narrate_every_secs = 12

[composio]
# The Composio user that owns WELLSY's connected accounts.
user_id = "wellsy"
# The read-only tool `wellsy doctor` runs per toolkit. Each must carry Composio's
# readOnlyHint tag; the doctor checks that at runtime before it calls the tool.
read_checks = { gmail = "GMAIL_GET_PROFILE", googlecalendar = "GOOGLECALENDAR_LIST_CALENDARS" }

[web]
playwright_mcp = "0.0.83"  # @playwright/mcp on npm
browser = "chrome"         # Google Chrome: Netflix needs its Widevine DRM
profile_dir = "~/.config/wellsy/chrome-profile"

# A site counts as logged in when its account page loads without bouncing to a
# sign-in page, i.e. the final URL matches `logged_in` (a regex).
[[web.sites]]
name = "Amazon"
check_url = "https://www.amazon.in/gp/css/order-history"
logged_in = "amazon\\.in/(gp/css/order-history|gp/your-account/order-history|your-orders)"
login_url = "https://www.amazon.in/"

[[web.sites]]
name = "Flipkart"
check_url = "https://www.flipkart.com/account/orders"
logged_in = "flipkart\\.com/account/orders"
login_url = "https://www.flipkart.com/account/login"

[[web.sites]]
name = "Myntra"
check_url = "https://www.myntra.com/my/orders"
logged_in = "myntra\\.com/my/orders"
login_url = "https://www.myntra.com/login"

[[web.sites]]
name = "Netflix"
check_url = "https://www.netflix.com/browse"
logged_in = "netflix\\.com/browse"
login_url = "https://www.netflix.com/login"
