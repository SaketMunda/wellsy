# WELLSY tool policy sidecar — step 5 Deliverable 2.
#
# Keyed by `<server>.<tool_name>`. One entry per tool. Fields:
#   capability        coarse action class the autonomy ledger tracks
#   risk              0..3  (see the risk map below)
#   reversible        true if the action can be undone without data loss
#   requires_approval true if a Confirm is required until autonomy promotes it
#   decision          optional hard override: "deny" is never executed at all
#
# Risk map (step 5):
#   0  all reads
#   1  create draft, create reminder, write to scratch
#   2  send mail, create or move a calendar event
#   3  delete anything, shell, write outside allowed roots
#
# A tool with NO entry here is risk 3 and fails closed (INVARIANTS #9). The
# acceptance suite proves this against `pim.debug_echo`, which is deliberately
# absent.

pim.calendar_list_events:
  capability: calendar.read
  risk: 0
  reversible: true
  requires_approval: false

pim.calendar_get_event:
  capability: calendar.read
  risk: 0
  reversible: true
  requires_approval: false

pim.calendar_create_event:
  capability: calendar.write
  risk: 2
  reversible: true
  requires_approval: true

pim.calendar_move_event:
